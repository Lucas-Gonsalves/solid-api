name: Run Unit Tests

on: [push]

jobs: 
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3333
      JWT_SECRET: github-actions-unit-test-secret
      DATABASE_URL: postgresql://docker:docker@localhost:5433/apisolid_test?schema=public

    steps: 
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
      
      - run: npm ci

      - run: npx prisma generate

      - run: npm run test
