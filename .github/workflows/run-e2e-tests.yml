name: Run E2E Tests

on: [pull_request]

jobs: 
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: bitnami/postgresql:latest
        ports:
          - 5433:5432
        env:
          POSTGRESQL_USERNAME: docker
          POSTGRESQL_PASSWORD: docker
          POSTGRESQL_DATABASE: apisolid_test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U docker -d apisolid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3333
      JWT_SECRET: github-actions-e2e-test-secret
      DATABASE_URL: postgresql://docker:docker@localhost:5433/apisolid_test?schema=public

    steps: 
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Create test env file
        run: |
          cat <<EOF > .env.test
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          JWT_SECRET=${JWT_SECRET}
          DATABASE_URL=${DATABASE_URL}
          EOF

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run e2e tests
        run: npm run test:e2e
